name: Build cezanne BPF kernel (for Android 16/17)

on:
  # push 触发时 inputs 为空, build.sh 会走内部默认
  # (erofs=yes / bpf=yes / uname=yes / ksu=no / 原厂 localversion),
  # 正好是 A16/A17 需要的组合; 并且让产物能回写到仓库便于取用。
  # 2026-11-11: 关闭 push 触发。scripts/** 的改动会同时触发本 workflow
  # 与 build-tree.yml，两者都往 main 回写产物，造成 push 竞态、日志丢失。
  # 本流水线保留手动 workflow_dispatch；日常编译走 build-tree.yml。
  workflow_dispatch:
    inputs:
      enable_erofs:
        description: '移植 fs/erofs —— ★必需: 实测 K40G A16/A17 移植包的 system/product/system_ext/vendor 全是 EROFS 格式, 原厂内核没这驱动刷不了'
        type: boolean
        default: true
      enable_bpf:
        description: '回合 BPF + sys_clone3（A16/A17 必需; A14 档不需要, 当前实验性）'
        type: boolean
        default: false
      enable_uname:
        description: '伪装 uname 为 5.4.186（放行 BPF 加载器的版本检查）'
        type: boolean
        default: true
      enable_ksu:
        description: '集成 KernelSU'
        type: boolean
        default: false
      enable_fbcon:
        description: '打开屏幕控制台 (VT + framebuffer console) —— 诊断用: 加 console=tty0 后内核日志与 panic 直接显示在手机屏幕上, 拍照即可取证 (原厂 defconfig 是 "# CONFIG_VT is not set")'
        type: boolean
        default: false
      enable_hungpanic:
        description: '卡死自恢复 —— 诊断用: 进程卡在 D 态/CPU 软锁 30s 即转 panic, 配合 PANIC_TIMEOUT=1 自动重启 (硬件狗 MTK_WATCHDOG 对"用户态卡死"无效, 没有它就永远卡着等人按键)'
        type: boolean
        default: false
      localversion:
        description: '内核版本后缀（必须保持 -perf-00252-g2f26b5917fd6 才能加载原厂 vendor 模块）'
        type: string
        default: '-perf-00252-g2f26b5917fd6'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: MiCode/Xiaomi_Kernel_OpenSource
          ref: cezanne-r-oss
          path: kernel
          # 不启用 LFS: 原厂树里没有 LFS 对象, 但 lfs:true 会在
          # "Setting up auth" 阶段卡住并拖垮整个 job (第 16 轮实测)
          lfs: false
          fetch-depth: 1
          # 完整 checkout —— BPF 补丁涉及 kernel/bpf/ include/ net/core/ 等多处,
          # sparse 会漏文件导致 patch apply 失败

      - name: Checkout this build repo
        uses: actions/checkout@v4
        with:
          path: buildrepo

      - name: Lint shell scripts for set -e hazards
        run: |
          # ★ 第 29 轮教训: 在 `set -euo pipefail` 下, grep 无匹配返回 1 会
          #   **静默杀掉整个脚本** —— 日志里连报错都没有, 白等 40 分钟编译。
          #   这个关卡在编译前把所有这类隐患揪出来。
          cd buildrepo
          echo "=== shell 语法检查 ==="
          for s in scripts/*.sh; do
            if bash -n "$s"; then echo "  [OK] $s"; else echo "  [FAIL] $s"; exit 1; fi
          done
          echo ""
          echo "=== set -e 隐患扫描 ==="
          python3 scripts/scan_sete.py scripts/build.sh || true
          echo ""
          echo "=== 未定义变量扫描 (set -u 隐患) ==="
          # ★ 第 32 轮教训: fetch_erofs.sh 引用了未定义的 $TMP,
          #   在 set -u 下直接退出 -> fs/Makefile/fs/Kconfig 注册没做
          #   -> CONFIG_EROFS_FS 被 syncconfig 丢掉 -> 白跑一轮编译
          python3 scripts/check_undef_vars.py scripts/fetch_erofs.sh scripts/build.sh || true

      - name: Verify kernel source checkout
        run: |
          echo "=== 内核树 checkout 状态 ==="
          ls -la kernel/ | head -20
          echo ""
          echo "=== 关键文件是否到位 ==="
          for f in Makefile arch/arm64/configs/cezanne_user_defconfig \
                   kernel/bpf/core.c kernel/bpf/verifier.c kernel/sys.c \
                   include/linux/bpf.h include/uapi/linux/bpf_types.h \
                   net/core/filter.c net/core/Makefile kernel/trace/bpf_trace.c; do
            if [ -f "kernel/$f" ]; then
              echo "  OK      $f  ($(stat -c%s kernel/$f) B)"
            else
              echo "  MISSING $f"
            fi
          done
          echo ""
          echo "=== 目录大小 ==="
          du -sh kernel/ 2>/dev/null
          echo "=== git 状态 ==="
          cd kernel && git log --oneline -1 && git status --short | head -5
          cd ..

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison flex build-essential ccache curl git git-lfs gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool lz4 \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev libncurses5 \
            dwarves python3 rsync cpio \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            clang lld llvm libclang-dev \
            linux-headers-generic || true
          # BPF 需要 pahole 生成 BTF
          sudo apt-get install -y -qq dwarves || true
          git lfs install
          echo "=== 工具链自检 ==="
          which aarch64-linux-gnu-gcc && aarch64-linux-gnu-gcc --version | head -1
          which clang && clang --version | head -1
          which ld.lld && ld.lld --version | head -1
          which pahole && pahole --version
          echo "=== zip/python3 自检 ==="
          which zip; which python3

      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
          # ★ 用 ccache 而不是缓存 out/ ——
          #   build.sh 开头有 `make mrproper`, 缓存 out/ 会被立刻清掉, 毫无意义。
          #   ccache 缓存的是 .o 文件的中间结果, 命中后重编能快 5~10 倍。
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Prepare EROFS source (pre-fetch, avoid network flakiness)
        run: |
          cd buildrepo
          # ★ 2026-11-09 起: erofs 源码已**预置在仓库** patches/erofs/ 里
          #   (来自 mt6873-dev 4.14.336 的原生 fs/erofs, 与 cezanne 同代码基)
          #   不再需要现场克隆 mt6768/mt6885 —— 省时间且不受网络影响。
          echo "=== 预置 erofs 源码 ==="
          ls -la patches/erofs/fs/erofs/ 2>/dev/null | head -25
          echo ""
          echo "C 文件数: $(find patches/erofs/fs/erofs -name '*.c' 2>/dev/null | wc -l)"
          test -f patches/erofs/fs/erofs/Kconfig || {
            echo "::error::预置 erofs 源码缺失"; exit 1; }
          test -f patches/erofs/include/trace/events/erofs.h || {
            echo "::error::预置 trace/events/erofs.h 缺失"; exit 1; }
          echo "::notice::erofs 源码就绪 ✓"

      - name: Pre-check BPF patches
        run: |
          echo "=== 验证 13 个 BPF/clone3 patch 能否干净 apply 到原厂树 ==="
          cd kernel
          FAIL=0
          for p in ../buildrepo/patches/mt6768-bpf/*.patch ../buildrepo/patches/clone3/*.patch; do
            [ -f "$p" ] || continue
            name=$(basename "$p")
            if git apply --check "$p" 2>/tmp/pe.txt; then
              echo "  [ OK ] $name"
            else
              echo "  [FAIL] $name"
              head -3 /tmp/pe.txt | sed 's/^/         /'
              FAIL=$((FAIL+1))
            fi
          done
          echo ""
          echo "失败数: $FAIL"
          if [ "$FAIL" -gt 0 ]; then
            echo "::error::有 patch 无法应用, 请检查内核树版本"
            exit 1
          fi
          echo "::notice::全部 patch 均可应用 ✓"
          cd ..

      - name: Build kernel
        env:
          enable_erofs: ${{ inputs.enable_erofs }}
          enable_bpf: ${{ inputs.enable_bpf }}
          enable_uname: ${{ inputs.enable_uname }}
          enable_ksu: ${{ inputs.enable_ksu }}
          enable_fbcon: ${{ inputs.enable_fbcon }}
          enable_hungpanic: ${{ inputs.enable_hungpanic }}
          localversion: ${{ inputs.localversion }}
          # 注意: 必须用绝对路径。内核树 checkout 在 workspace 根 (kernel/),
          # 而 buildrepo/ 是本仓库 —— 两者是兄弟目录, 不是父子。
          KERNEL_DIR: ${{ github.workspace }}/kernel
          OUT: ${{ github.workspace }}/out
          PATCH_DIR: ${{ github.workspace }}/buildrepo/patches
          EROFS_TREE: ${{ github.workspace }}/buildrepo/patches/erofs
          SCRIPTS_DIR: ${{ github.workspace }}/buildrepo/scripts
        run: |
          cd buildrepo
          chmod +x scripts/*.sh
          # 注意: 必须用 PIPESTATUS 取 build.sh 的真实退出码,
          # 直接 `bash x.sh | tee log` 会让 tee 的 0 覆盖掉脚本的失败
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Verify outputs
        run: |
          # ★ 第 30 轮教训: build.sh 的产物全在 buildrepo/ 下 (它会 cd 回去),
          #   而这一步默认在仓库根目录 —— 直接 cat kernel-release.txt 会报
          #   "No such file or directory" 并且**让整个 job 失败**,
          #   导致后面的 Upload artifacts 被跳过, 内核包根本没上传出来!
          cd buildrepo
          echo "=== kernel-release ==="
          cat kernel-release.txt
          echo ""
          echo "=== BUILD-INFO ==="
          cat BUILD-INFO.txt
          echo ""
          echo "=== 关键校验 ==="
          REL=$(cat kernel-release.txt)
          EXPECT="4.14.186-perf-00252-g2f26b5917fd6"
          if [ "$REL" != "$EXPECT" ]; then
            echo "::error title=版本串不匹配::实际=$REL 期望=$EXPECT -- vendor .ko 会全部加载失败, 不可刷"
            exit 1
          else
            echo "::notice::kernel-release 与原厂完全一致 OK"
          fi
          for k in CONFIG_EROFS_FS CONFIG_DEBUG_INFO_BTF CONFIG_MODVERSIONS CONFIG_FHANDLE CONFIG_BPF_SYSCALL CONFIG_FAKE_UNAME; do
            if grep -q "^$k=y" config.txt; then
              echo "::notice::$k=y OK"
            else
              echo "::warning::$k 未启用"
            fi
          done
          echo ""
          echo "=== 产物 ==="
          ls -la artifacts/ 2>/dev/null || ls -la *.zip 2>/dev/null || echo "无 zip"
          # 产物必须存在, 否则明确失败 (不要让 upload 步骤空跑)
          if [ -z "$(ls artifacts/*.zip 2>/dev/null)" ]; then
            echo "::error title=没有产出内核包::artifacts/ 下没有 zip"
            exit 1
          fi
          echo "::notice::内核包已产出 ✓"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cezanne-kernel-bpf
          path: |
            buildrepo/artifacts/*.zip
            buildrepo/kernel-release.txt
            buildrepo/BUILD-INFO.txt
            buildrepo/config.txt
            buildrepo/System.map
            buildrepo/build.log
          if-no-files-found: warn
          retention-days: 30

      # 把构建产物回写到仓库, 便于在没有 gh/token 的环境里取用。
      # if: always() 保证编译失败时也能拿到 build.log 排障。
      # commit message 带 [skip ci], 且 push trigger 的 paths 不含 ci-output/,
      # 双保险避免自触发循环。
      - name: Publish build outputs into repo
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd buildrepo
          mkdir -p ci-output
          for f in kernel-release.txt BUILD-INFO.txt config.txt System.map build.log; do
            if [ -f "$f" ]; then cp -f "$f" ci-output/; fi
          done
          cp -f artifacts/*.zip ci-output/ 2>/dev/null || true
          echo "=== 待发布产物 ==="
          ls -lh ci-output/ || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-output
          if git diff --cached --quiet; then
            echo "没有新产物需要提交"
          else
            git commit -m "ci: publish A17 kernel outputs [skip ci]"
            git push origin HEAD:main || echo "push 失败; 产物仍可从 Actions Artifacts 获取"
          fi
